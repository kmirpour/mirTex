name: Release MirTex

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create as a draft release instead of publishing immediately'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck, lint, and unit tests
        run: npm run check

  publish-tauri:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: ''
          - platform: 'windows-latest'
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish MirTex release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'MirTex v__VERSION__'
          releaseBody: |
            ## MirTex v__VERSION__

            Download the installer for your operating system from the **Assets** section below:

            - **Windows (x64):** `MirTex_*_x64-setup.exe` *(NSIS installer — recommended)* or `.msi`
            - **macOS (Apple Silicon M1–M4):** `MirTex_*_aarch64.dmg`
            - **macOS (Intel):** `MirTex_*_x64.dmg`
            - **Linux:** `.AppImage` or `.deb`

            > **Optional companions:** Install **TeX Live** (or MiKTeX) for local LaTeX PDF compilation, and enable **Zotero 10** Local API (*Settings → Advanced → Allow other applications on this computer to communicate with Zotero*) for live citation search.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft || false }}
          prerelease: false
          args: ${{ matrix.args }}
